<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGDSA LLM Security CTF — Live Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#040704;--panel:#09120a;--line:#14401c;--g:#39ff14;--tx:#d6ffd6;--mid:#8fd89a;--lo:#4f8f58;--a:#ffb000;--r:#ff4d4d;--gold:#ffb000;--silver:#e6ece6;--bronze:#d98a3d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1000px 520px at 50% -15%,rgba(57,255,20,.09),transparent 65%),var(--bg);color:var(--tx);font:500 16px/1.3 'JetBrains Mono',ui-monospace,monospace;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px);padding:clamp(12px,1.8vw,30px)}
[hidden]{display:none!important}
.vt{font-family:'VT323',monospace;font-weight:400}

/* header */
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(12px,2vw,32px);align-items:center}
.brand h1{margin:0;font:400 clamp(34px,4.4vw,76px)/.9 'VT323',monospace;color:var(--g);text-shadow:0 0 16px rgba(57,255,20,.45)}
.brand h1::after{content:"_";animation:cur 1.1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.brand p{margin:8px 0 0;color:var(--lo)}
.pwbox{border:2px solid var(--a);background:rgba(255,176,0,.06);padding:clamp(10px,1.5vh,18px) clamp(22px,3vw,54px);text-align:center;cursor:pointer;position:relative;min-width:min(580px,92vw);box-shadow:0 0 28px rgba(255,176,0,.18)}
.pwbox .l{color:var(--a);font-size:clamp(12px,1.1vw,18px)}
.pwbox .l::before{content:"$ cat "}
.pw{font:800 clamp(32px,5vw,88px)/1.05 'JetBrains Mono',monospace;letter-spacing:.05em;color:var(--a);text-shadow:0 0 18px rgba(255,176,0,.5);word-break:break-all}
.pw.off{font:500 clamp(18px,2vw,30px) 'JetBrains Mono',monospace;color:var(--lo);text-shadow:none;letter-spacing:0}
.pwbox .j{color:var(--mid);font-size:clamp(13px,1.2vw,20px);margin-top:2px}
.copied{position:absolute;right:12px;top:8px;font-size:13px;color:var(--g);opacity:0;transition:opacity .3s}
.copied.on{opacity:1}
.meta{justify-self:end;text-align:right}
.clock{font:400 clamp(30px,3.4vw,58px)/1 'VT323',monospace;color:var(--a)}
.sub{margin-top:6px;color:var(--lo);display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap}
.sub b{color:var(--g)}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--g)}
.live i{width:9px;height:9px;background:currentColor;box-shadow:0 0 8px currentColor;animation:blink 1.8s infinite}
.live.bad{color:var(--r)}
@keyframes blink{50%{opacity:.3}}

/* board */
.board{flex:1;min-height:0;display:flex;flex-direction:column;--rh:72px}
.cols,.row{display:grid;grid-template-columns:calc(var(--rh)*1.9) minmax(0,1fr) auto calc(var(--rh)*2.6) calc(var(--rh)*2.6);align-items:center;column-gap:clamp(8px,1.4vw,24px);padding:0 clamp(14px,1.8vw,30px)}
.cols{height:30px;color:var(--lo);font-size:13px;border-bottom:1px dashed var(--line)}
.cols span:nth-child(n+4){text-align:right}
.wrap{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-top:8px}
.wrap::-webkit-scrollbar{display:none}
.list{position:relative}
.row{position:absolute;left:0;right:0;top:0;height:calc(var(--rh) - 8px);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);
  transition:transform .9s cubic-bezier(.22,1,.36,1),border-color .6s,background .6s,opacity .5s}
.row.enter{opacity:0}
.row.moved-up{border-color:var(--g);background:rgba(57,255,20,.10);z-index:2;box-shadow:0 0 22px rgba(57,255,20,.22)}
.row.moved-down{border-color:var(--r);background:rgba(255,77,77,.10);z-index:2;box-shadow:0 0 22px rgba(255,77,77,.2)}
.row.g1{border-left-color:var(--gold)}.row.g2{border-left-color:var(--silver)}.row.g3{border-left-color:var(--bronze)}
.row.gain{animation:gain 1.8s ease-out}
.row.gain .pt{animation:pop .7s ease-out}
@keyframes gain{0%{background:rgba(57,255,20,.40)}100%{background:var(--panel)}}
@keyframes pop{40%{transform:scale(1.15)}}
.rk{display:flex;align-items:center;gap:10px}
.rn{font:400 calc(var(--rh)*.72)/1 'VT323',monospace;color:var(--mid);min-width:1.5ch}
.rn::before{content:"#";color:var(--lo);font-size:.6em;margin-right:2px}
.g1 .rn{color:var(--gold);text-shadow:0 0 14px rgba(255,176,0,.5)}.g2 .rn{color:var(--silver)}.g3 .rn{color:var(--bronze)}
.mv{font:800 calc(var(--rh)*.22)/1 'JetBrains Mono',monospace;padding:4px 8px;opacity:0;transition:opacity .4s;white-space:nowrap}
.mv.show{opacity:1}.mv.up{background:var(--g);color:#031a00}.mv.down{background:var(--r);color:#2a0000}
.tn{display:block;font:700 calc(var(--rh)*.36)/1.1 'JetBrains Mono',monospace;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn::before{content:"> ";color:var(--lo)}
.rc{display:none;color:var(--lo);font-size:calc(var(--rh)*.2)}
.pips{display:flex;gap:calc(var(--rh)*.05)}
.pips i{width:calc(var(--rh)*.15);height:calc(var(--rh)*.36);border:1px solid var(--line);background:transparent}
.pips i.a{background:var(--g);border-color:var(--g);box-shadow:0 0 8px rgba(57,255,20,.5)}
.pips i.b{background:var(--a);border-color:var(--a);box-shadow:0 0 8px rgba(255,176,0,.5)}
.pips i.s{margin-left:calc(var(--rh)*.14)}
.rt{text-align:right;font-size:calc(var(--rh)*.27);color:var(--mid);font-variant-numeric:tabular-nums}
.pt{text-align:right;font:400 calc(var(--rh)*.75)/1 'VT323',monospace;color:var(--g);text-shadow:0 0 12px rgba(57,255,20,.4);transform-origin:right center}
.pt small{font:500 calc(var(--rh)*.2) 'JetBrains Mono',monospace;color:var(--lo);margin-left:6px;text-shadow:none}
.empty{padding:70px 20px;text-align:center;color:var(--lo);font-size:22px}
.empty::after{content:"_";animation:cur 1.1s steps(1) infinite}

/* ticker */
.ticker{display:flex;gap:14px;overflow:hidden;min-height:38px;align-items:center}
.tk{white-space:nowrap;border:1px solid var(--line);padding:7px 14px;color:var(--mid)}
.tk.new{border-color:var(--g);color:var(--tx);box-shadow:0 0 14px rgba(57,255,20,.2)}
.tk b{color:var(--tx)}.tk em{font-style:normal;color:var(--g);font-weight:700}.tk small{color:var(--lo);margin-left:8px}

@media(max-width:1000px){
  body{overflow:auto}.app{height:auto;min-height:100vh}
  .top{grid-template-columns:1fr}.pwbox{order:-1;min-width:0}.meta{justify-self:start;text-align:left}.sub{justify-content:flex-start}
  .wrap{flex:none;height:68vh}.board{flex:none}
  .cols,.row{grid-template-columns:calc(var(--rh)*1.9) minmax(0,1fr) calc(var(--rh)*2.4)}
  .pips,.rt,.cols span:nth-child(3),.cols span:nth-child(4){display:none}.rc{display:block}
}
@media(prefers-reduced-motion:reduce){body::after{display:none}.row,.mv{transition:none}.row.gain,.row.gain .pt,.live i,.brand h1::after,.empty::after{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>NGDSA://LLM_CTF</h1><p>live standings</p></div>
    <div class="pwbox" id="pwbox" title="Click to copy">
      <div class="l">event_password</div>
      <div class="pw off" id="pw">...</div>
      <div class="j" id="join" hidden>join at <span id="joinUrl"></span></div>
      <span class="copied" id="copied">copied</span>
    </div>
    <div class="meta">
      <div class="clock" id="clock">--:--:--</div>
      <div class="sub">
        <span><b id="sT">0</b> teams</span>
        <span><b id="sC">0</b> flags</span>
        <span class="live" id="live"><i></i><span>live</span></span>
      </div>
    </div>
  </header>

  <main class="board" id="board">
    <div class="cols"><span>// place</span><span>team</span><span>progress</span><span>reached_at</span><span>points</span></div>
    <div class="wrap" id="wrap"><div class="list" id="list"></div><div class="empty" id="empty">waiting for teams to join</div></div>
  </main>

  <footer class="ticker" id="ticker"></footer>
</div>
<span id="sP" hidden></span>

<script>
const FLAGS={A1:['System prompt leak',1,100],A2:['PII exfiltration',1,100],A3:['IDOR breach',1,100],A4:['WebSocket side-channel',1,100],A5:['Local file',1,100],
  B1:['NGDSA welcome',2,150],B2:['Legacy source',2,150],B3:['Buffer overflow leak',2,150],B4:['RAG impersonation',2,150],B5:['Browser artifact',2,150]};
const $=id=>document.getElementById(id);
const hms=iso=>new Date(iso).toTimeString().slice(0,8);
const cmp=(x,y)=>x<y?-1:x>y?1:0;
const caps=t=>t.flags.filter(Boolean).length, p1Done=t=>t.flags.slice(0,5).every(Boolean);
function ago(iso){const s=Math.max(0,Math.round((Date.now()-new Date(iso))/1000));if(s<60)return s+'s ago';const m=Math.round(s/60);return m<60?m+'m ago':Math.round(m/60)+'h ago'}

// ranking: more points first; equal points -> whoever reached them earlier; then registration order
const sortTeams=ts=>[...ts].sort((a,b)=>b.score-a.score||cmp(a.last_capture||'9',b.last_capture||'9')||cmp(a.registered||'9',b.registered||'9')||cmp(a.team_id,b.team_id));

const rows=new Map(); let prev={}, first=true, hover=false;

function makeRow(){
  const el=document.createElement('div'); el.className='row';
  el.innerHTML='<div class="rk"><span class="rn"></span><span class="mv"></span></div><div><span class="tn"></span><span class="rc"></span></div><div class="pips"></div><div class="rt"></div><div class="pt"></div>';
  const p=el.querySelector('.pips');
  for(let i=0;i<10;i++){const s=document.createElement('i');if(i===5)s.className='s';p.appendChild(s)}
  return el;
}
function fill(el,t,rank){
  el.className=el.className.replace(/\bg[123]\b/g,'').trim()+(rank<=3?' g'+rank:'');
  el.querySelector('.rn').textContent=String(rank).padStart(2,'0');
  el.querySelector('.tn').textContent=t.team_id;
  const when=t.last_capture&&t.score>0?hms(t.last_capture):'--:--:--';
  el.querySelector('.rc').textContent=t.score>0?'reached '+when:'no flags yet';
  el.querySelector('.rt').textContent=when;
  el.querySelector('.pt').innerHTML=t.score+'<small>pts</small>';
  el.querySelectorAll('.pips i').forEach((s,i)=>{s.classList.toggle('a',!!t.flags[i]&&i<5);s.classList.toggle('b',!!t.flags[i]&&i>=5)});
}
function mark(el,dir,k){
  const mv=el.querySelector('.mv'); mv.className='mv show '+dir; mv.textContent=(dir==='up'?'▲ ':'▼ ')+k;
  el.classList.remove('moved-up','moved-down'); el.classList.add('moved-'+dir);
  clearTimeout(el._t); el._t=setTimeout(()=>{mv.classList.remove('show');el.classList.remove('moved-up','moved-down')},9000);
}
function render(teams){
  const sorted=sortTeams(teams), n=sorted.length, wrap=$('wrap'), list=$('list');
  $('empty').hidden=n>0;
  const rh=Math.max(58,Math.min(110,Math.floor((wrap.clientHeight-8)/Math.max(n,1))));
  $('board').style.setProperty('--rh',rh+'px'); list.style.height=(n*rh)+'px';
  const seen=new Set();
  sorted.forEach((t,i)=>{
    seen.add(t.team_id); const rank=i+1; let el=rows.get(t.team_id), fresh=false;
    if(!el){el=makeRow();rows.set(t.team_id,el);el.style.transform=`translateY(${i*rh}px)`;if(!first){el.classList.add('enter');fresh=true}list.appendChild(el)}
    fill(el,t,rank);
    const old=prev[t.team_id];
    if(old&&!first){
      if(rank<old.rank)mark(el,'up',old.rank-rank); else if(rank>old.rank)mark(el,'down',rank-old.rank);
      if(t.score>old.score){el.classList.remove('gain');void el.offsetWidth;el.classList.add('gain')}
    }
    el.style.transform=`translateY(${i*rh}px)`;
    if(fresh)requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('enter')));
  });
  for(const [id,el] of rows)if(!seen.has(id)){el.remove();rows.delete(id)}
  prev=Object.fromEntries(sorted.map((t,i)=>[t.team_id,{rank:i+1,score:t.score}]));
  first=false;
  $('sT').textContent=n; $('sC').textContent=teams.reduce((a,t)=>a+caps(t),0); $('sP').textContent=teams.filter(p1Done).length;
}
function ticker(ev){
  const list=ev.filter(r=>FLAGS[r.flag]).slice(0,5);
  $('ticker').innerHTML=list.length?list.map((r,i)=>{const f=FLAGS[r.flag];
    return `<span class="tk${i?'':' new'}">&gt; <b></b> captured ${f[0]} <em>+${f[2]}</em><small>${ago(r.time)}</small></span>`}).join(''):'<span class="tk">&gt; waiting for the first capture...</span>';
  [...$('ticker').querySelectorAll('.tk b')].forEach((b,i)=>b.textContent=list[i].team);   // textContent: team names can never inject HTML
}
function live(ok){const c=$('live');c.classList.toggle('bad',!ok);c.lastElementChild.textContent=ok?'live':'reconnecting'}
async function poll(){
  try{
    const [a,b]=await Promise.all([fetch('/api/standings',{cache:'no-store'}),fetch('/api/feed?limit=6',{cache:'no-store'})]);
    if(!a.ok||!b.ok)throw 0;
    render(await a.json()); ticker(await b.json()); live(true);
  }catch(e){live(false)}
}
async function banner(){
  try{
    const d=await (await fetch('/api/banner',{cache:'no-store'})).json(), pw=$('pw');
    if(d.event_password){pw.textContent=d.event_password;pw.classList.remove('off')}else{pw.textContent='ask an organizer';pw.classList.add('off')}
    $('join').hidden=!d.join_url; $('joinUrl').textContent=d.join_url||'';
  }catch(e){}
}
$('pwbox').onclick=()=>{const pw=$('pw');if(pw.classList.contains('off')||!navigator.clipboard)return;
  navigator.clipboard.writeText(pw.textContent).then(()=>{const c=$('copied');c.classList.add('on');setTimeout(()=>c.classList.remove('on'),1500)})};
$('wrap').addEventListener('mouseenter',()=>hover=true);$('wrap').addEventListener('mouseleave',()=>hover=false);
// many teams: slowly page through the list on the projector (pauses while someone hovers/scrolls)
setInterval(()=>{const w=$('wrap');if(hover||w.scrollHeight<=w.clientHeight+2)return;const max=w.scrollHeight-w.clientHeight;
  w.scrollTo({top:w.scrollTop>=max-2?0:Math.min(max,w.scrollTop+w.clientHeight*.8),behavior:'smooth'})},9000);
addEventListener('resize',()=>{if(Object.keys(prev).length)poll()});
setInterval(()=>$('clock').textContent=new Date().toTimeString().slice(0,8),1000);$('clock').textContent=new Date().toTimeString().slice(0,8);
poll();banner();setInterval(poll,3000);setInterval(banner,30000);
</script>
</body>
</html>
